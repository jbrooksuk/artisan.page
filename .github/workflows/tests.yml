name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test command signature descriptions
        run: php tests/php/signature-description.php

      - name: Build production server
        run: npm run build

      - name: Smoke test standalone production server
        run: |
          runtime=$(mktemp -d)
          cp -R .output/. "$runtime/"
          PORT=3000 HOST=127.0.0.1 node "$runtime/server/index.mjs" > "$runtime/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$runtime"' EXIT

          if ! curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/ -o /dev/null; then
            cat "$runtime/server.log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/api/versions
